<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/-/cloud-sync.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>밤의 도둑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
/* VOICE: 조용하고 긴장감 있는 한밤의 잠입
   IDEA: 손전등 빛만 새어 나오는 어두운 저택 평면도
   PICTURE: 플레이어 주변만 밝은 탑뷰 저택, 경비의 노란 시야 부채꼴
   COLOUR and TYPE: 밤색 남보라 바탕, 손전등 노랑, 발각 빨강, 보석 청록 / Do Hyeon
   LAYOUT: 상단 상태바, 전체 화면 캔버스, 왼쪽 조이스틱, 오른쪽 도구 버튼 */
:root{--bg:#0d0b14;--ink:#efe9ff;--dim:#9b92b5;--lamp:#ffd866;--red:#ff4b5c;--gem:#4fe3e0;--pan:#1b1726e6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 'Do Hyeon',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#0d0b14f0,#0d0b1400);pointer-events:none}
#row{display:flex;align-items:center;gap:12px;font-size:16px;padding-right:46px}
#row span{white-space:nowrap}
#gemS.on{color:var(--gem)}
#gw{margin-top:6px;height:8px;border-radius:4px;background:#ffffff1a;overflow:hidden;max-width:55%}
#sw{margin-top:4px;height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden;max-width:40%}
#sb{height:100%;width:100%;background:#6fdc8c}
#sb.ex{background:#ff9a3d}
#gb{height:100%;width:0;background:var(--red);transition:width .08s}
.circ{position:fixed;top:calc(8px + env(safe-area-inset-top));right:12px;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff2a;background:var(--pan);display:grid;place-items:center;padding:0;z-index:12}
.circ svg{width:20px;height:20px}
#tools{touch-action:none;position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,64px);gap:10px}
.tb{touch-action:none;position:relative;width:64px;height:64px;border-radius:50%;border:2px solid #ffffff22;background:var(--pan);font-size:15px;padding:0}
.tb span{position:absolute;right:-2px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--lamp);color:#1a1400;font-size:13px;line-height:22px}
.tb.on{border-color:var(--lamp);background:#3d321a}
.tb.no{opacity:.35}
#baseTop{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 60px 8px 14px;font-size:20px;pointer-events:none;background:linear-gradient(#0d0b14e0,#0d0b1400)}
#baseTop b{font-weight:400;color:var(--lamp)}#baseHeld{color:var(--dim);font-size:15px}
#mgBtn{position:fixed;right:98px;bottom:calc(14px + env(safe-area-inset-bottom));width:76px;height:76px;font-size:17px}
#decoBtn{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));width:76px;height:76px;font-size:17px}
#steal,#baseAct{position:fixed;right:12px;bottom:calc(240px + env(safe-area-inset-bottom));width:138px;height:52px;border-radius:26px;border:2px solid var(--lamp);background:#3d321ae6;color:var(--lamp);font-size:19px}
#baseAct{bottom:calc(104px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#000c;padding:7px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:11}
#toast.on{opacity:1}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;background:#07050cb8}
.box{background:#1b1726f2;border:1px solid #ffffff14;border-radius:18px;padding:24px 22px;max-width:380px;width:100%;max-height:calc(100dvh - 40px);overflow-y:auto}
#menu{background:radial-gradient(ellipse at 50% 38%,#07050c40,#07050cee 70%);flex-direction:column}
#menu h1{margin:0;font-weight:400;font-size:clamp(46px,14vw,64px);line-height:1;color:var(--lamp);text-shadow:0 0 30px #ffd86655}
#menu .sub{color:var(--dim);margin:10px 0 34px;font-size:17px}
#menu .play{width:220px;min-height:60px;border:0;border-radius:30px;background:var(--lamp);color:#1a1400;font-size:26px;box-shadow:0 8px 30px #ffd86640}
#menu .ghost{margin-top:12px;width:220px;min-height:46px;border:1px solid #ffffff30;border-radius:23px;background:transparent;font-size:17px}
#menu .best{margin-top:22px;color:var(--dim)}
.box h2{margin:0 0 10px;font-weight:400;font-size:32px;text-align:center;line-height:1.1}
.box p{margin:7px 0;color:var(--dim);font-size:15px}
.box .c{text-align:center;color:var(--ink);font-size:17px}
.box .big{margin-top:16px;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--lamp);color:#1a1400;font-size:20px}
.box .sec{margin-top:10px;width:100%;min-height:46px;border:1px solid #ffffff30;border-radius:12px;background:transparent;font-size:17px}
.set{margin:14px 0}
.set label{display:block;margin-bottom:6px;font-size:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border:1px solid #ffffff22;border-radius:10px;background:#2a2338;font-size:15px}
.seg button.on{background:var(--lamp);color:#1a1400;border-color:var(--lamp)}
.tb.run{background:#3a1f24e6;border-color:#ff4b5c88;font-size:16px}
.tb.run.on{background:#ff4b5c;color:#fff;border-color:#ff4b5c}
.tb.q{font-size:14px;line-height:1.15}
.tb.q small{display:block;color:var(--dim);font-size:11px}
#hpS{display:flex;gap:4px;margin-left:auto}
#hpS i{width:14px;height:14px;border-radius:3px;background:var(--red)}
#hpS i.off{background:#ffffff22}
#gw{position:relative}
#gw.al #gb{animation:fl .4s infinite alternate}
@keyframes fl{to{background:#ffd866}}
.bag{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #ffffff12}
.bag .nm{flex:1;font-size:17px}.bag .nm small{display:block;color:var(--dim);font-size:13px}
.bag button{width:52px;min-height:44px;border:1px solid #ffffff22;border-radius:10px;background:#2a2338;font-size:14px}
.bag button.on{background:var(--lamp);color:#1a1400}
.bag button:disabled{opacity:.35}
.grade{font-size:84px;line-height:1;text-align:center;color:var(--lamp);margin:4px 0 8px}
.grade.gS{color:var(--gem);text-shadow:0 0 24px #4fe3e088}.grade.gD{color:var(--dim)}
.shop h3{margin:14px 0 2px;font-weight:400;font-size:18px;color:var(--lamp)}
#misS{margin-top:5px;font-size:13px;color:var(--dim)}
#lp{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(340px,calc(100% - 24px));background:#1b1726f0;border:1px solid #ffd86655;border-radius:16px;padding:12px 14px;z-index:8;text-align:center}
#lpT{font-size:17px;margin-bottom:8px}
#lpBar{position:relative;height:26px;border-radius:13px;background:#2a2338;overflow:hidden}
#lpZ{position:absolute;top:0;bottom:0;background:#6fdc8c66;border-left:2px solid #6fdc8c;border-right:2px solid #6fdc8c}
#lpN{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.lpb{display:flex;gap:8px;margin-top:10px}
.lpb button{flex:1;min-height:52px;border-radius:12px;border:0;background:var(--lamp);color:#1a1400;font-size:21px}
.lpb button+button{flex:.5;background:transparent;border:1px solid #ffffff30;color:var(--ink);font-size:16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin:8px 0}
.tro{background:#2a2338;border:1px solid transparent;border-radius:10px;padding:10px 4px 8px;text-align:center;font-size:13px}
.tro.new{border-color:#ffd86688}
.tro b{display:block;font-weight:400;margin-top:8px;line-height:1.15}.tro small{color:var(--lamp)}
.ic{width:26px;height:26px;margin:0 auto;background:var(--c)}
.ic.gem{width:18px;height:18px;transform:rotate(45deg);margin-top:4px;box-shadow:0 0 10px var(--c)}
.ic.frame{border:4px solid #b8862e;width:34px;height:26px}
.ic.round{border-radius:50%;border:3px solid #ffffff44}
.ic.bar{height:12px;width:30px;margin-top:7px;border-radius:2px}
.ic.box{border-radius:5px}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="row"><span id="flS">1층</span><span id="scS">돈 0</span><span id="gemS">보석 없음</span><span id="hpS"></span></div>
  <div id="gw"><div id="gb"></div></div>
  <div id="sw"><div id="sb"></div></div>
  <div id="misS"></div>
</div>
<button id="pauseBtn" class="circ hidden" aria-label="일시정지"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
<button id="steal" class="hidden">훔치기</button>
<div id="tools" class="hidden">
  <button class="tb q" id="q0"></button>
  <button class="tb q" id="q1"></button>
  <button class="tb" id="bagBtn">가방</button>
  <button class="tb run" id="runBtn">달리기</button>
  <button class="tb" id="punchBtn">주먹</button>
</div>
<div id="toast"></div>
<div id="baseUI" class="hidden">
  <div id="baseTop"><b>내 기지</b> <span id="baseHeld"></span></div>
  <button class="circ" id="baseExit" aria-label="나가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="tb" id="decoBtn">장식</button>
  <button class="tb" id="mgBtn">관리</button>
  <button id="baseAct" class="hidden"></button>
</div>
<div id="lp" class="hidden"><div id="lpT"></div><div id="lpBar"><div id="lpZ"></div><div id="lpN"></div></div><div class="lpb"><button id="lpGo">따기!</button><button id="lpX">그만</button></div></div>

<div id="menu" class="scr">
  <button id="setBtn" class="circ" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="7.5" stroke-width="4" stroke-dasharray="2.9 3"/><circle cx="12" cy="12" r="5" stroke-width="2.2"/></svg></button>
  <h1>밤의 도둑</h1>
  <div class="sub">경비의 눈을 피해 보석을 훔쳐라</div>
  <button class="play" id="playBtn">플레이</button>
  <button class="ghost" id="howBtn">게임 방법</button>
  <button class="ghost" id="galBtn">내 기지</button>
  <div class="best" id="bestS">최고 점수 0</div>
</div>
<div id="ov" class="scr hidden"></div>

<script>
{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PAL=['#5e4634','#55425a','#465445','#614f39','#4d4256','#5a3f3f'];
const ACT={phone:{d:[5,8],r:1.6,h:.35,txt:'...'},smoke:{d:[5,7],r:2.4,h:.45,txt:'후~'},snack:{d:[4,6],r:2,h:.4,txt:'냠냠'},doze:{d:[6,9],r:.9,h:.3,txt:'zz'},
 shoe:{d:[2,3.5],r:1,h:.5,txt:'끈이...'},stretch:{d:[2,3],r:3,h:.7,txt:'으아~'},wall:{d:[3,5],r:3.6,h:.5,txt:'흠...'},chat:{d:[6,9],r:2.4,h:.5,txt:'블라블라'},wait:{d:[4,4],r:3,h:.6,txt:''}};
const PERS={lazy:{c:'#3d5a8c',dist:.65,rg:-.6,sp:.85,gl:1.6},normal:{c:'#2d4c94',dist:.35,rg:0,sp:1,gl:1},sharp:{c:'#24357a',dist:.12,rg:.9,sp:1.1,gl:.55},sentry:{c:'#2b4470',dist:.2,rg:.4,sp:1,gl:.8},police:{c:'#161a28',dist:.08,rg:.7,sp:1.15,gl:.6},captain:{c:'#6a1f24',dist:0,rg:2,sp:1.05,gl:.5}};
const RANGE={stone:6.5,smoke:5.5,dart:6,gun:7,sil:7,hook:4.5,cracker:6.5};
const NAME={stone:'돌',smoke:'연막',dart:'수면침',box:'상자',gun:'총',sil:'소음기 총',hook:'갈고리',hammer:'망치',fake:'가짜 보석',cracker:'폭죽',baton:'전기봉',pick:'따개'};
const PASSIVE=['hammer','fake','pick'];
const LOOTF={shelf:[['희귀 책',120],['고서',180]],ward:[['모피 코트',200],['보석함',320]],desk:[['노트북',250],['만년필',110]],table:[['은촛대',150],['꽃병',180]],sofa:[['쿠션 속 지갑',90]],crate:[['와인',100],['골동품',220]],stack:[['와인',100],['골동품',220]],bed:[['베개 속 비상금',130]]};
const ICON={'보석':['gem','#4fe3e0'],'그림':['frame','#a33b3b'],'시계':['round','#ffd866'],'금괴':['bar','#d9a520'],'진열장 보물':['gem','#ffd866'],'금고 귀중품':['box','#9aa3b5'],'희귀 책':['box','#a33b3b'],'고서':['box','#7a5a34'],'모피 코트':['round','#8a6a4a'],'보석함':['box','#c76b8a'],'노트북':['box','#4a4a58'],'만년필':['bar','#222'],'은촛대':['bar','#d8dde8'],'꽃병':['round','#3b6aa3'],'쿠션 속 지갑':['box','#5a3a24'],'와인':['bar','#6a1f24'],'골동품':['round','#b8862e'],'베개 속 비상금':['box','#3f8a5a'],'전설의 명화':['frame','#c9a24a'],'스탠드 조명':['round','#ffe0a0'],'화분':['round','#3f8a4a'],'유리 진열장':['box','#bfe8ff'],'소파':['box','#8a3b4a'],'대리석 기둥':['bar','#aaa5b8'],'금 트로피':['gem','#ffd866']};
const FDECO={'스탠드 조명':{p:300,s:'lamp'},'화분':{p:150,s:'plant'},'유리 진열장':{p:500,s:'case'},'소파':{p:400,s:'sofa'},'대리석 기둥':{p:450,s:'pillar'},'금 트로피':{p:800,s:'trophy'}};
let BASE={store:{},deco:[]};try{const b=JSON.parse(localStorage.getItem('thief_base')||'null');if(b&&b.store)BASE=b;else BASE.store=JSON.parse(localStorage.getItem('thief_gal')||'{}')}catch(e){}
const saveBase=()=>{try{localStorage.setItem('thief_base',JSON.stringify(BASE))}catch(e){}};
const GAL=BASE.store;
let SK=BASE.sk||(BASE.sk={});
const own=k=>(BASE.store[k]||0)+BASE.deco.filter(d=>d.k===k).length;
const SETS=[{n:'미술 애호가',d:'그림 5점',b:'시작할 때 연막 1개',ok:()=>own('그림')>=5},{n:'보석상',d:'보석 3개',b:'최대 체력 +1',ok:()=>own('보석')>=3},{n:'금괴왕',d:'금괴 10개',b:'시작 돈 +300',ok:()=>own('금괴')>=10},{n:'책벌레',d:'희귀 책·고서 4권',b:'자물쇠 초록 칸 넓어짐',ok:()=>own('희귀 책')+own('고서')>=4},{n:'시계 수집가',d:'시계 3개',b:'이동 속도 +5%',ok:()=>own('시계')>=3},{n:'골동품상',d:'골동품·은촛대·꽃병 6개',b:'훔친 물건 값 +10%',ok:()=>own('골동품')+own('은촛대')+own('꽃병')>=6}];
const setOn=i=>SETS[i].ok();
const SKILLS=[['pick','소매치기 달인','훔칠 수 있는 거리↑ 들킬 확률↓',3],['lock','자물쇠 장인','초록 칸 넓어짐',3],['stealth','그림자','발각 속도 -6%',3],['foot','고양이 발','발소리 -10%',3],['tough','맷집','최대 체력 +1',2]];
const lvOf=()=>1+Math.floor(Math.sqrt((BASE.xp||0)/150)),nextXp=()=>150*lvOf()**2,skPts=()=>lvOf()-1-Object.values(SK).reduce((a,b)=>a+b,0);
let AC=null;function au(){if(!SET.snd)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,sl){const a=au();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function hiss(d,v,f){const a=au();if(!a)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const g=a.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start()}
const SFX={step:()=>hiss(.05,.05,500),run:()=>hiss(.06,.1,900),beat:()=>{tone(55,.12,'sine',.35);setTimeout(()=>tone(48,.12,'sine',.25),130)},click:()=>tone(1400,.05,'square',.06),clank:()=>{hiss(.15,.2,2500);tone(220,.15,'square',.08,.5)},punch:()=>{hiss(.1,.25,400);tone(90,.1,'sine',.3,.5)},siren:()=>tone(700,.45,'sawtooth',.05,1.6),coin:()=>{tone(1200,.08,'square',.04);setTimeout(()=>tone(1800,.1,'square',.04),70)},squawk:()=>tone(1500,.25,'sawtooth',.08,.6),pop:()=>hiss(.3,.4,1500),door:()=>tone(160,.2,'triangle',.12,.7),shot:()=>hiss(.18,.3,3000)};
window.addEventListener('pointerdown',()=>{if(SET.snd)au()});
function trophy(k){if(!k)return;runBag[k]=(runBag[k]||0)+1}
const lootSec=()=>{const ks=Object.keys(runBag);if(!ks.length)return'';return'<p style="color:var(--lamp);margin-top:4px">훔친 물건 (탈출하면 내 기지로)</p><div class="gal">'+ks.map(k=>{const[s,c]=ICON[k]||['box','#888'];return`<div class="tro"><div class="ic ${s}" style="--c:${c}"></div><b>${k}</b><small>×${runBag[k]}</small></div>`}).join('')+'</div><p style="color:var(--lamp)">도구</p>'};

 ctx.fillStyle=hasGem?'#2fbf71':'#ff4b5c';ctx.fillRect(mx+exitT.x*k-2,my+exitT.y*k-2,4,4);

 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx+P.x*k,my+P.y*k,2.5,0,7);ctx.fill()}

function how(){
 show(`<h2>게임 방법</h2>
 <p>왼쪽 화면을 누르고 끌면 조이스틱으로 조용히 걸어요. 달리기 버튼을 누르고 있으면 훨씬 빨라지지만 스태미나를 쓰고 발소리에 경비가 와요.</p>
 <p>노란 부채꼴이 경비 시야예요. 안에 있으면 발각 게이지가 차고, 가득 차면 경보! 총 든 경비는 쏘고 나머지는 쫓아와요. 총알을 피하고 시야에서 8초 벗어나면 따돌려요. 체력 3칸이 다 닳으면 체포. 반쯤 차면 경비가 쫓아오고 무전으로 동료를 불러요. 놓치면 내가 도망간 방향을 예상해서 수색해요.</p>
 <p>처음엔 맨손이에요. 경비가 폰 보기, 담배, 간식, 졸기, 신발끈, 수다 떨기처럼 한눈팔 때나 등 뒤로 몰래 다가가면 훔치기 버튼이 떠요. 허리춤에 주머니가 보이는 경비가 뭔가 갖고 있고, 총 든 경비는 총을 뺏을 수 있어요. 가끔 뒤를 휙 돌아보니 조심하세요.</p>
 <p>얻은 도구는 가방에 들어가고, 퀵 칸 2개에 장착해서 써요. 돌, 연막, 수면침, 총은 퀵 버튼을 누른 채로 조이스틱처럼 끌어서 조준하고, 떼면 던져요. 가운데로 돌려놓고 떼면 취소돼요. 조준하는 동안은 시간이 느려져요. 상자는 쓰고 가만히 있으면 안 보이지만 경계 중인 경비가 바로 옆에 오면 의심해요.</p>
 <p>경비마다 성격이 있어요. 게으른 경비(밝은 파랑)는 자주 딴짓하고, 예리한 경비(진한 남색)는 시야가 길고 자주 뒤돌아봐요. 보초는 한자리를 지켜요.</p>
 <p>3층부터는 주민(분홍 시야)이 돌아다녀요. 나를 보면 소리 지르고 가장 가까운 경비한테 달려가 신고해요. 5층부터는 경찰(검은 제복, 금색 배지)이 나와요. 경찰은 항상 총을 들고, 가까이 오면 테이저건을 쏘는데 맞으면 스태미나가 바로 바닥나요.</p>
 <p>상호작용 버튼 하나로 다 해요: 잠긴 문(열쇠 든 경비를 털거나 3초간 자물쇠 따기), 불 끄기(어두운 방은 경비 시야 절반, 경비가 와서 다시 켬), 환풍구(들어가면 천장 배관 안에 계속 머물 수 있어요. 경비 눈엔 안 보이고 배관을 따라 기어 다니다 아무 환풍구로 나오면 돼요. 움직이면 가끔 덜컹 소리가 나요), 관제 단말기(카메라 전부 끄기), 벽에 걸린 그림, 유리 진열장(망치 필요), 잠든 경비의 옷 뺏기(변장: 멀리선 안 들킴)와 끌어서 옷장·책장에 숨기기.</p>
 <p>삐걱이는 바닥은 살짝 줄무늬가 보여요. 4층부터 경비견이 냄새로 발자취를 쫓아와요(상자로는 못 속이고 연막이 냄새를 지워요). 3층부터 보석 방엔 깜빡이는 레이저가 있고, 보석을 그냥 집으면 경보가 울려요(가짜 보석으로 바꿔치기). 5층마다 경비대장이 무전으로 전체를 지휘해요.</p>
 <p>방마다 문이 닫혀 있을 수 있어요. 닫힌 문은 너머가 안 보이고, 열면 작은 소리가 나요. 금색 자물쇠가 달린 문과 금고는 미니게임으로 따요: 왼쪽오른쪽으로 움직이는 바늘이 초록 칸에 있을 때 따기! 누르기. 틀리면 철컬 소리가 나고 핀 하나가 풀려요. 따는 동안에도 시간은 흘러요.</p>
 <p>기절시킨 경비가 깨면 “누가 날 때렸어!” 하고, 동료가 쓰러진 경비를 보면 저택 전체가 경계 상태가 돼요. 경계 Lv이 오를수록 경비 시야가 길어져요. 기절시켰으면 옷장·책장에 숨기세요.</p>
 <p>2층부터 침실에 잠든 집주인이 있어요. 근처에서 움직이거나 소리를 내면 뒤척이고, 다 깨면 비상벨을 눌러 바로 경보예요. 머리맡 금시계(+400)를 노려보세요.</p>
 <p>반짝이는 가구(책장, 옷장, 책상, 테이블, 소파, 상자, 침대)는 뒤져서 훔칠 수 있어요. 훔친 물건은 가방에 들어가고, 탈출하면 내 기지 보관함으로 가요. 붙잡히면 가방 속 물건은 모두 빼앗겨요. 메뉴나 은신처에서 내 기지에 들어가 돌아다니며, 장식 버튼으로 물건을 들고 원하는 자리에 놓거나 치울 수 있어요.</p>
 <p>닫힌 문 너머 방은 어둡게 가려져서 안에 누가 있는지 안 보여요. 문 앞에 가만히 서 있으면 엿볼 수 있어요. 옷장에 숨을 수 있고(조이스틱을 크게 움직이면 나옴), 경계 중인 경비가 가까이 오면 열어볼 수도 있어요. 3층부터 앵무새(천으로 덮기), 5층부터 빨간 격자의 열감지 방(움직이면 감지, 금괴 있음), 10층마다 전설의 명화가 있는 보스 저택이 나와요. 경보를 울릴수록 현상수배(별)가 올라 경비와 경찰이 늘고, 경보 없이 탈출하면 내려가요.</p>
 <p>내 기지의 관리 버튼: 도둑 레벨 스킬, 컨렉션 보너스(세트를 모으면 영구 효과), 기지 확장, 가구 상점. 동료 도둑 두더지에게 말 걸면 다음 저택 정보를 알려줘요.</p>
 <p>주먹 버튼(키보드 F)으로 맨손으로 때릴 수 있어요. 경계 중이 아닌 경비를 완전히 등 뒤에서(또는 한눈팔 때) 치면 한 방에 6초 기절이에요. 그 외엔 3초 안에 4대를 연속으로 맞혀야 하고, 맞을 때마다 발각 게이지가 크게 오르고 무전을 불러요. 경찰은 기습이 안 통하고, 경비대장은 주먹으로 못 쓰러뜨려요. 개는 잠깐 물러나고 주민은 한 방이에요. 때릴 때 소리가 나요.</p>
 <p>층이 올라갈수록 새로운 게 나와요. 2층: 벽 금고(4초 따기, +600)와 저택 이벤트(비, 파티, 어둠, 경계 강화, 부자 저택, 보름달). 3층: 두꺼비집(전원 내리면 전체 정전, 경비가 고치러 옴), 폭죽(2초 뒤 큰 소리). 4층: 압력판(바닥의 희미한 네모, 밟으면 딸깍!), 전기봉(옆에서 쓰면 조용히 기절). 6층: 감시 드론(벽 위로 날아다니고 총으로만 격추). 은신처에서 따개를 사면 자물쇠와 금고를 빨리 따요.</p>
 <p>탈출하면 등급(S~D)과 의뢰 보너스를 받고, 은신처에서 도구를 사고 업그레이드해요.</p>
 <p>보석(청록)을 훔쳐 출구(빨강)로 탈출하세요. 금괴가 있는 금고 방엔 경비가 붙어 있어요.</p>
 <button class="big" id="hok">알겠어요</button>`);
 $('hok').onclick=hideOv;
}
